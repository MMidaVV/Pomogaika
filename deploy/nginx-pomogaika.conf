# Боевой конфиг pomogaika.vddapp.ru. Строки ssl_* дописывает certbot при первом выпуске
# сертификата — в свежей установке их ещё нет, это нормально.
server {
    listen 80;
    listen [::]:80;
    server_name pomogaika.vddapp.ru;

    client_max_body_size 20m;
    access_log /var/log/nginx/pomogaika.access.log;
    error_log  /var/log/nginx/pomogaika.error.log;

    # Веб-панели нет: единственный вход — мини-приложение Telegram.
    # Ручки /api/* закрыты подписью initData в самом приложении, не паролем в nginx.
    location / {
        include /etc/nginx/pomogaika-proxy.conf;
    }
}
