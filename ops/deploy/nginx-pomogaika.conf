# /etc/nginx/sites-available/pomogaika.vddapp.ru
#
# Шаг 1: положить этот файл без блока 443, поднять, получить сертификат
#         certbot --nginx -d pomogaika.vddapp.ru  — он допишет TLS сам.
# Шаг 2: вернуть auth_basic (см. ниже), пока в приложении нет своей проверки доступа.

server {
    listen 80;
    listen [::]:80;
    server_name pomogaika.vddapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pomogaika.vddapp.ru;

    ssl_certificate     /etc/letsencrypt/live/pomogaika.vddapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pomogaika.vddapp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ВАЖНО. В приложении нет аутентификации: открытый /api/* отдаёт все брони
    # и позволяет писать гостям. Пока не сделана проверка Telegram initData,
    # держим весь сайт за паролем.
    auth_basic "Pomogaika";
    auth_basic_user_file /etc/nginx/.htpasswd-pomogaika;

    # в поиск не отдаём
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
