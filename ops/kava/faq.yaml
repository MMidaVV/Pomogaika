# Корпус из реальных переписок сентября 2026 (dialogs/).
# Коды, пароли, телефоны и полные ФИО в файл не кладём.

- class: typical
  q: Как заехать? Где ключи?
  a: Заезд с 14:00, ул. Гагарина 87, 1 подъезд, 3 этаж, кв. 19. Если бронь оплачена — за 2 часа пришлём код калитки, код домофона подъезда и код сейфа у двери. В квартире домофона нет, код действует только на калитку и подъезд.
  keywords: [заезд, заселен, ключ, сейф, как пройти, где квартира, подъезд]

- class: typical
  q: Какой код от калитки / домофона?
  a: Код одноразовый и приходит в этот чат только оплаченной брони, не раньше чем за 2 часа до заезда. Если код не сработал — напишите сразу, вышлем новый или откроем удалённо. Ночью не оставляем гостя у калитки.
  keywords: [код, калитки, домофон, не подходит, не срабатывает, открыть]

- class: typical
  q: Есть Wi-Fi? Пароль?
  a: Wi-Fi есть. Имя сети и пароль пришлём вместе с кодами в окне заезда, после оплаты.
  keywords: [wifi, wi-fi, вайфай, вай-фай, интернет, пароль]

- class: typical
  q: Где парковка? Можно на машине?
  a: Парковка бесплатная, открытая, за территорией. Карту на шлагбаум даём по запросу. Если такси или вы сами через шлагбаум к подъезду — напишите, откроем или позвоним в охрану.
  keywords: [парков, машин, шлагбаум, авто, карта для въезда]

- class: typical
  q: Как до моря?
  a: До Балтики около 120 метров, выходите — и вы на Променаде. Полотенца на пляж, пластиковые бокалы и набор для пикника лежат в шкафу в прихожей, можно брать.
  keywords: [море, пляж, променад, балтик, полотенц, пикник]

- class: typical
  q: Можно с собакой / питомцем?
  a: Да, питомцы можно. Без вечеринок, курить в квартире нельзя. Детей любого возраста принимаем.
  keywords: [собак, питом, кот, животных, детей, курить, вечерин]

- class: typical
  q: Во сколько заезд и выезд? Можно раньше / позже?
  a: Заезд с 14:00, выезд до 12:00. Ранний заезд — если квартира уже свободна, напишите время, уточним. Поздний выезд — только если нет следующего гостя; это отдельная услуга, решение за собственником.
  keywords: [во сколько, выезд, заезд, раньше, позже, продлить, до 18]

- class: typical
  q: Как включить кондиционер?
  a: Нажмите включение и поставьте 22. Если в зале гаснет или нет обдува — напишите, разберёмся.
  keywords: [кондиционер, кондей, вентилятор, жарко, "22"]

- class: typical
  q: Что за жидкость на стиральной машине?
  a: Это гель для стирки, для всех типов белья. Можно на глаз, сильно не пенится. Мерного стаканчика нет.
  keywords: [стираль, гель, кондиционер для белья, машин]

- class: typical
  q: Нужен трансфер из аэропорта?
  a: Из Храброво можем встретить и привезти к квартире — это по заезду, напишите рейс и время. Обратно в аэропорт трансфер платный, ориентир 2000 ₽, подтверждает собственник.
  keywords: [трансфер, аэропорт, храброво, такси, встреча]

- class: money
  q: Можно скидку / вернуть деньги / отменить?
  a: Скидки, возвраты и отмену брони решает только собственник. Сама ничего не обещаю — передам запрос.
  keywords: [скидк, возврат, вернуть деньги, отмен, бесплатно, дешевле]

- class: money
  q: Залог?
  a: Страховой депозит 5000 ₽, в стоимость не входит, возвращаем после уборки. Реквизиты пришлём при заезде.
  keywords: [залог, депозит, "5000", пять тысяч]

- class: conflict
  q: Не работает свет / розетки / автомат
  a: Это уже поломка, не типовой FAQ. Передаю собственнику и мастеру. Если можете — попробуйте поднять автомат, но не насилуйте щиток.
  keywords: [розетк, автомат, электри, не работает, фен, щиток, сломал]

- class: conflict
  q: Шумно, стройка, соседи
  a: Жалобы и шум — собственнику, с фактами. Не спорю с гостем и не обещаю компенсацию сама.
  keywords: [шум, стройк, соседи, жалоб, кричат]

- class: other
  q: Можно ещё одно одеяло / нас будет больше
  a: Нестандартные просьбы и лишние гости — уточняю у собственника, сама не разрешаю.
  keywords: [одеяло, больше гостей, ещё один, нас пятеро]
